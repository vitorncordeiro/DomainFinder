spring:
  data:
    redis:
      port: 6379
      host: localhost
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - openid
              - email
              - profile
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
  session:
    store-type: redis
    timeout: 7d
  mongodb:
    uri: ${MONGO_URI}
logging:
  level:
    org.springframework.boot.context.config: DEBUG
iana:
  data-base-url: ${IANA_DATA_BASE_URL}
  base-url: ${IANA_BASE_URL}
hostinger:
  api:
    token: ${HOSTINGER_API_TOKEN}
playwright:
  server:
    url: ws://localhost:3000
rdap:
  client:
    url: http://rdap.org
icann:
  authentication:
    base-url: https://account-api.icann.org
  account:
    username: ${ICANN_ACCOUNT_USERNAME}
    password: ${ICANN_ACCOUNT_PASSWORD}
czds:
  base-url:  https://czds-api.icann.org
  download-base-url: https://czds-download-api.icann.org
  directory: ${CZDS_DIRECTORY}