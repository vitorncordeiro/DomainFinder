services:
  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
  playwright:
    image: mcr.microsoft.com/playwright:v1.61.1-jammy
    command: npx playwright run-server --port 3000 --host 0.0.0.0
    ports:
      - "3000:3000"
volumes:
  redis_data:
